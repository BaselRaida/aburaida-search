<style>
:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --card:#211d18; --ink:#f2ece4; --muted:#a59b8e; --line:#3a332b;
    --accent:#d39a5c; --accent-ink:#1a140d; --soft:#2c251d; --ok:#6cc58f; --ok-soft:#1d3326;
    --sel:#33281a; --sel-line:#a57636; --warn:#e78a70; --gift-a:#5a3a1c; --gift-b:#8c6230; --gift-ink:#fff4e3; --gift-line:#a57636; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16130f; --card:#211d18; --ink:#f2ece4; --muted:#a59b8e; --line:#3a332b;
  --accent:#d39a5c; --accent-ink:#1a140d; --soft:#2c251d; --ok:#6cc58f; --ok-soft:#1d3326;
  --sel:#33281a; --sel-line:#a57636; --warn:#e78a70; --gift-a:#5a3a1c; --gift-b:#8c6230; --gift-ink:#fff4e3; --gift-line:#a57636; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:190px;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:20px;margin:0 0 8px;font-weight:700}
.search{width:100%;font:inherit;font-size:17px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.search:focus{outline:2px solid var(--accent);outline-offset:0}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stats{font-size:13px;color:var(--muted);margin-top:8px}
main{padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row.selected{background:var(--sel);border-color:var(--sel-line)}
.row.sent .name{color:var(--muted)}
.chk{width:24px;height:24px;flex:none;accent-color:var(--accent);cursor:pointer}
.info{flex:1;min-width:0;cursor:pointer}
.name{font-weight:700;font-size:16px}
.sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phone{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink)}
.phone.bad{color:var(--warn)}
.badge{display:inline-block;font-size:12px;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:1px 8px;margin-inline-start:6px;font-weight:500}
.btns{display:flex;gap:6px;flex:none}
.ib{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.ib.sentbtn[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.bar .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
.bar .acts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.big{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:12px;padding:11px 8px;cursor:pointer;background:var(--soft);color:var(--ink)}
.big.primary{background:var(--accent);color:var(--accent-ink)}
.big.ok{background:var(--ok);color:#fff}
a.big{display:flex;align-items:center;justify-content:center;text-decoration:none}
.big[aria-disabled="true"]{opacity:.45;pointer-events:none}
.big:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:0}
details.msg{margin-top:8px;font-size:14px}
details.msg textarea{width:100%;min-height:70px;font:inherit;font-size:15px;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.gift{padding-block:14px 4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gift .card{max-width:760px;margin:0 auto;text-align:center;border-radius:18px;padding:18px 16px;background:linear-gradient(135deg,var(--gift-a),var(--gift-b));color:var(--gift-ink);border:1px solid var(--gift-line);box-shadow:0 6px 20px rgba(138,90,43,.18)}
.gift .from{font-size:15px;font-weight:500;opacity:.92;text-wrap:balance}
.gift .from b{font-weight:700}
.gift .wish{font-size:21px;font-weight:700;line-height:1.6;margin-top:8px;text-wrap:balance}
.gift .orn{display:block;font-size:13px;letter-spacing:.4em;opacity:.7;margin-bottom:4px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:480px){
  .ib .lbl{display:none}
  .row{padding:9px 10px;gap:8px}

<main><div class="wrap" id="list"></div></main>

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const sent = new Set(store.get('abr_sent', []));
const selected = new Set(store.get('abr_sel', []));
let filter = 'all';

const msgEl = document.getElementById('msg');
msgEl.value = store.get('abr_msg', '');
msgEl.addEventListener('input', () => store.set('abr_msg', msgEl.value));

function norm(s){
  return String(s || '')
    .replace(/[ً-ْـ]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace(/\s+/g, '').toLowerCase();
}
DATA.forEach((p, i) => { p.i = i; p.key = norm(p.n + '|' + p.s + '|' + p.p + '|' + p.r); });

function save(){ store.set('abr_sent', [...sent]); store.set('abr_sel', [...selected]); }

const toastEl = document.getElementById('toast');
let tt;
function toast(t){ toastEl.textContent = t; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 1600); }

async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove(); return ok;
  }
}

const listEl = document.getElementById('list');
function render(){
  const terms = document.getElementById('q').value.trim().split(/\s+/).map(norm).filter(Boolean);
  let rows = DATA.filter(p => terms.every(t => p.key.includes(t)));
  if (filter === 'sent') rows = rows.filter(p => sent.has(p.p));
  if (filter === 'unsent') rows = rows.filter(p => !sent.has(p.p));
  if (filter === 'selected') rows = rows.filter(p => selected.has(p.p));

  const LIMIT = 300;
  const shown = rows.slice(0, LIMIT);
  listEl.innerHTML = shown.length ? '' : '<div class="empty">لا توجد نتائج</div>';
  const frag = document.createDocumentFragment();
  shown.forEach(p => {
    const isSent = sent.has(p.p), isSel = selected.has(p.p), noPhone = !p.p;
    const d = document.createElement('div');
    d.className = 'row' + (isSel ? ' selected' : '') + (isSent ? ' sent' : '');
    d.innerHTML =
      `<input type="checkbox" class="chk" ${isSel ? 'checked' : ''} ${noPhone ? 'disabled' : ''} aria-label="تحديد">
       <div class="info">
         <div class="name"></div>
         <div class="sub"></div>
         <div class="phone ${p.ok ? '' : 'bad'}"></div>
       </div>
       <div class="btns">
         <button class="ib copy" ${noPhone ? 'disabled' : ''}>📋<span class="lbl"> نسخ</span></button>
         <button class="ib sentbtn" aria-pressed="${isSent}" ${noPhone ? 'disabled' : ''}>${isSent ? '✓' : '○'}<span class="lbl"> ${isSent ? 'أُرسل' : 'لم يُرسل'}</span></button>
       </div>`;
    d.querySelector('.name').textContent = p.n;
    if (isSent){ const b = document.createElement('span'); b.className = 'badge'; b.textContent = 'تم الإرسال ✓'; d.querySelector('.name').appendChild(b); }
    d.querySelector('.sub').textContent = [p.s && ('الزوج/ة: ' + p.s), p.r].filter(Boolean).join(' · ');
    d.querySelector('.phone').textContent = p.p ? p.p + (p.ok ? '' : '  (رقم غير مكتمل؟)') : 'لا يوجد رقم';
    const toggleSel = () => { if (noPhone) return; selected.has(p.p) ? selected.delete(p.p) : selected.add(p.p); save(); render(); };
    d.querySelector('.chk').addEventListener('change', toggleSel);
    d.querySelector('.info').addEventListener('click', toggleSel);
    d.querySelector('.copy').addEventListener('click', async () => { if (await copy(p.p)) toast('تم نسخ ' + p.p); });
    d.querySelector('.sentbtn').addEventListener('click', () => { sent.has(p.p) ? sent.delete(p.p) : sent.add(p.p); save(); render(); });
    frag.appendChild(d);
  });
  listEl.appendChild(frag);
  if (rows.length > LIMIT){ const m = document.createElement('div'); m.className = 'empty'; m.textContent = `يظهر أول ${LIMIT} من ${rows.length} — اكتب في البحث لتضييق النتائج`; listEl.appendChild(m); }

  const uniquePhones = new Set(DATA.map(p => p.p).filter(Boolean));
  const sentCount = [...uniquePhones].filter(x => sent.has(x)).length;
  document.getElementById('stats').textContent =
    `${DATA.length} أسرة · ${uniquePhones.size} رقم · تم الإرسال لـ ${sentCount} · متبقي ${uniquePhones.size - sentCount}` +
    (terms.length || filter !== 'all' ? ` · النتائج: ${rows.length}` : '');
  const n = selected.size;
  document.getElementById('selCount').textContent = n;
  ['copySel', 'markSel'].forEach(id => document.getElementById(id).disabled = !n);
  updateSms();
}

document.getElementById('q').addEventListener('input', render);
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));
document.getElementById('clearSel').addEventListener('click', () => { selected.clear(); save(); render(); });
document.getElementById('copySel').addEventListener('click', async () => {
  const nums = [...selected];
  if (await copy(nums.join(', '))) toast(`تم نسخ ${nums.length} رقم`);
});
function updateSms(){
  const a = document.getElementById('smsSel');
  const nums = [...selected];
  if (!nums.length){ a.setAttribute('aria-disabled','true'); a.href = '#'; return; }
  a.setAttribute('aria-disabled','false');
  const body = msgEl.value.trim();
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let url = isIOS ? 'sms://open?addresses=' + nums.join(',') : 'sms:' + nums.join(',');
  if (body) url += (isIOS ? '&' : '?') + 'body=' + encodeURIComponent(body);
  a.href = url;
}
msgEl.addEventListener('input', updateSms);
document.getElementById('markSel').addEventListener('click', () => {
  const n = selected.size;
  selected.forEach(p => sent.add(p)); selected.clear(); save(); render();
  toast(`تم تعليم ${n} كمُرسل له`);
});

render();
</script>
</div>

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
